plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spindisk.tablet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.spindisk.tablet'
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName '0.7.8'
        resourceConfigurations += ['es', 'en']
    }

    buildTypes {
        debug {
            // El APK de depuración es el que se instala desde GitHub Actions.
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            kotlin.srcDirs += ['src/main/kotlin']
            // `node scripts/native.mjs` copia dist/ aquí antes de compilar.
            assets.srcDirs += ['src/main/assets']
        }
    }
}

// La única dependencia es la biblioteca estándar de Kotlin, y va escrita a mano
// a propósito: el plugin la añade solo, pero si algún día deja de hacerlo el APK
// saldría sin ella y la app se cerraría al instante en cualquier teléfono con
// «NoClassDefFoundError», sin pantalla y sin pista. Mejor explícito.
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
