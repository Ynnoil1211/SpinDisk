plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spindisk.tablet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.spindisk.tablet'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '0.7.4'
        resourceConfigurations += ['es', 'en']
    }

    buildTypes {
        debug {
            // El APK de depuraciÃ³n es el que se instala desde GitHub Actions.
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            kotlin.srcDirs += ['src/main/kotlin']
            // `node scripts/native.mjs` copia dist/ aquÃ­ antes de compilar.
            assets.srcDirs += ['src/main/assets']
        }
    }
}

// La Ãºnica dependencia es la biblioteca estÃ¡ndar de Kotlin, y va escrita a mano
// a propÃ³sito: el plugin la aÃ±ade solo, pero si algÃºn dÃ­a deja de hacerlo el APK
// saldrÃ­a sin ella y la app se cerrarÃ­a al instante en cualquier telÃ©fono con
