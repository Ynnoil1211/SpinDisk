org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No hay una sola dependencia de AndroidX: todo es `android.jar` y WebView.
# Se deja activado porque es el valor con el que AGP se prueba a diario; en
# falso, cualquier herramienta que inyecte un artefacto AndroidX rompe el
# build con «this project uses AndroidX dependencies».
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
