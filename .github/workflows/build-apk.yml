name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos pushes seguidos no deben pelearse por la misma release: gana el último.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Necesario para crear la release y subir el APK.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Web y assets
        run: |
          npm run build
          node scripts/native.mjs --no-build

      - name: Contrato nativo
        run: node scripts/nativecheck.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # La clave de depuración de Gradle se genera sola la primera vez. Sin
      # guardarla, cada compilación firma con una clave distinta y Android
      # rechaza instalar la nueva encima de la anterior ("Aplicación no
      # instalada"): habría que desinstalar en cada actualización.
      - name: Firma estable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # Si algo falla, estos números son lo primero que hay que leer: el
      # registro de Gradle no dice con qué versión se intentó.
      - name: Versiones
        run: |
          java -version
          gradle --version
          node --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Un APK sin código dentro se instala y se cierra al instante, sin decir
      # nada. Este paso lo caza antes de que llegue al teléfono: si el dex pesa
      # menos de lo que pesa la biblioteca estándar de Kotlin, algo se perdió.
      - name: Revisar el APK
        run: |
          set -e
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          unzip -l "$apk" | grep -E 'classes[0-9]*\.dex' || true
          dex=$(unzip -l "$apk" | awk '/classes[0-9]*\.dex/ { total += $1 } END { print total + 0 }')
          assets=$(unzip -l "$apk" | awk '/assets\/www\// { total += $1 } END { print total + 0 }')
          echo "dex: $dex bytes · assets/www: $assets bytes"
          if [ "$dex" -lt 300000 ]; then
            echo "::error::El APK no lleva el código dentro (dex de $dex bytes)."
            exit 1
          fi
          if [ "$assets" -lt 60000 ]; then
            echo "::error::El APK no lleva la interfaz dentro (assets de $assets bytes)."
            exit 1
          fi

      # Con nombre de archivo entendible al llegar a la tablet.
      - name: Preparar el artefacto
        run: cp android/app/build/outputs/apk/debug/app-debug.apk spindisk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: spindisk-apk
          path: spindisk.apk
          if-no-files-found: error

      # Release pública con el APK para descargarlo sin entrar en Actions (los
      # artefactos exigen sesión en GitHub y caducan a los 90 días). La etiqueta
      # sale de `versionName`: si la versión no cambió, la release se rehace
      # apuntando al último commit, así el enlace
      # releases/latest/download/spindisk.apk siempre da el APK más reciente.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(sed -nE "s/.*versionName '([^']+)'.*/\1/p" android/app/build.gradle)
          if [ -z "$version" ]; then
            echo "::error::No se encontró versionName en android/app/build.gradle."
            exit 1
          fi
          tag="v$version"
          short=$(git rev-parse --short HEAD)
          cat > notes.md <<EOF
          APK compilado automáticamente desde \`$short\`.

          **Instalación:** descarga \`spindisk.apk\`, ábrelo en tu dispositivo Android (7.0+) y concede el permiso de *Acceso a notificaciones* al primer arranque.
          Si Play Protect lo frena, consulta [docs/apk.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/apk.md).
          EOF
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" spindisk.apk \
            --target "$GITHUB_SHA" \
            --title "SpinDisk $version" \
            --notes-file notes.md \
            --latest
