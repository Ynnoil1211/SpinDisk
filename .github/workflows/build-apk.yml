name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Web y assets
        run: |
          npm run build
          node scripts/native.mjs --no-build

      - name: Contrato nativo
        run: node scripts/nativecheck.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Si algo falla, estos números son lo primero que hay que leer: el
      # registro de Gradle no dice con qué versión se intentó.
      - name: Versiones
        run: |
          java -version
          gradle --version
          node --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: spindisk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
