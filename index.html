<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#efe4cf" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="./styles.css" />
    <title>SpinDisk · tocadiscos de escritorio</title>
  </head>
  <body>
    <canvas id="stage" aria-label="Tocadiscos"></canvas>

    <div class="edge-grip" id="edge-grip" aria-hidden="true"></div>

    <section id="console" class="console" aria-hidden="true" aria-label="Consola de control">
      <div class="console__inner">
        <div class="module module--transport">
          <button class="tbtn" id="btn-prev" type="button" aria-label="Anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M18 6.2v11.6L9.2 12z" fill="currentColor" />
            </svg>
          </button>
          <button class="tbtn tbtn--play" id="btn-play" type="button" aria-label="Reproducir o pausar">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.5 5.6v12.8L18.6 12z" fill="currentColor" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="5.5" width="3.4" height="13" rx="1" fill="currentColor" />
              <rect x="13.6" y="5.5" width="3.4" height="13" rx="1" fill="currentColor" />
            </svg>
          </button>
          <button class="tbtn" id="btn-next" type="button" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 5v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M6 6.2v11.6L14.8 12z" fill="currentColor" />
            </svg>
          </button>
        </div>

        <div class="module module--timeline">
          <div class="timeline__meta">
            <span id="t-now">0:00</span>
            <span id="t-state" class="pill">escuchando</span>
            <span id="t-left">-0:00</span>
          </div>
          <div class="timeline__bar">
            <div class="track">
              <div class="track__fill" id="track-fill"></div>
              <div class="track__knob" id="track-knob"></div>
            </div>
            <input
              id="timeline"
              class="timeline__input"
              type="range"
              min="0"
              max="1000"
              value="0"
              step="1"
              aria-label="Posición de la canción"
            />
          </div>
        </div>

        <div class="module module--texture">
          <span class="module__label">Vinilo</span>
          <div class="swatches" id="swatches" role="group" aria-label="Textura del vinilo">
            <button class="swatch is-active" data-texture="marble" type="button" title="Marmoleado camaleónico" aria-label="Marmoleado camaleónico"></button>
            <button class="swatch" data-texture="black" type="button" title="Vinilo negro clásico 180 g" aria-label="Vinilo negro clásico"></button>
            <button class="swatch" data-texture="cream" type="button" title="Crema opaco vintage" aria-label="Crema opaco vintage"></button>
            <button class="swatch" data-texture="glass" type="button" title="Cristal translúcido" aria-label="Cristal translúcido"></button>
            <button class="swatch" data-texture="smoke" type="button" title="Humo ámbar translúcido" aria-label="Humo ámbar translúcido"></button>
            <button class="swatch" data-texture="terracotta" type="button" title="Terracota suave" aria-label="Terracota suave"></button>
            <button class="swatch" data-texture="sage" type="button" title="Verde salvia veteado" aria-label="Verde salvia veteado"></button>
          </div>
        </div>

        <div class="module module--desk">
          <span class="module__label">Fondo</span>
          <div class="swatches" id="desk-swatches" role="group" aria-label="Fondo de la mesa">
            <button class="swatch is-active" data-desk="album" type="button" title="Portada adaptativa" aria-label="Portada adaptativa"></button>
            <button class="swatch" data-desk="wood" type="button" title="Madera nogal cálido" aria-label="Madera nogal cálido"></button>
            <button class="swatch" data-desk="sand" type="button" title="Arena y lino suave" aria-label="Arena y lino suave"></button>
            <button class="swatch" data-desk="slate" type="button" title="Pizarra grafito nocturna" aria-label="Pizarra grafito nocturna"></button>
            <button class="swatch" data-desk="sage" type="button" title="Verde salvia relajante" aria-label="Verde salvia relajante"></button>
          </div>
        </div>

        <div class="module module--rpm">
          <span class="module__label">Velocidad</span>
          <div class="switch" id="rpm-switch" role="group" aria-label="Velocidad de giro">
            <button data-rpm="33" class="is-active" type="button" aria-label="33 revoluciones por minuto">33⅓</button>
            <button data-rpm="45" type="button" aria-label="45 revoluciones por minuto">45</button>
          </div>
        </div>

        <div class="module module--foley">
          <span class="module__label">Volumen</span>
          <div class="foley">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z" fill="currentColor" />
              <path d="M15.4 8.6a4.6 4.6 0 010 6.8M18 6.2a8.2 8.2 0 010 11.6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" />
            </svg>
            <input id="foley" type="range" min="0" max="100" value="55" aria-label="Volumen del dispositivo" />
          </div>
        </div>

        <div class="module module--clock">
          <span class="module__label">Reloj</span>
          <div class="switch" id="clock-switch" role="group" aria-label="Hora mientras suena">
            <button data-clock="off" class="is-active" type="button" aria-label="Sin reloj al reproducir">No</button>
            <button data-clock="on" type="button" aria-label="Mostrar la hora al reproducir">Hora</button>
          </div>
        </div>

        <button class="source" id="source" type="button" aria-label="Abrir Spotify">
          <span class="source__badge" id="source-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.14" />
              <path d="M7.2 9.2c3.3-.9 6.6-.6 9.4.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none" />
              <path d="M7.9 12.3c2.6-.7 5.3-.4 7.6.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
              <path d="M8.5 15.2c2-.5 4.1-.3 5.9.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" />
            </svg>
          </span>
          <span class="source__text">
            <strong id="source-name">Spotify</strong>
            <small>mantén para ventana</small>
          </span>
        </button>
      </div>
      <div class="console__grip" aria-hidden="true"></div>
    </section>

    <div id="sandbox" class="sandbox" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="banner" class="banner" role="alert" hidden>
      <span class="banner__text" data-banner-text></span>
      <button class="banner__action" type="button" data-banner-action>Activar</button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
